<!DOCTYPE html>
<html lang="ja">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1c1108;--paper:#fdf8f0;--red:#b51f1f;--red-lt:#fdf0ee;--gold:#c8860a;--gold-lt:#fef7e0;--blue:#1a56a0;--blue-lt:#eef3fb;--green:#1a7a3c;--green-lt:#edf7f1;--muted:#7a6a55;--border:#e8dcc8;--panel:#fff;--sans:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
#shell{display:flex;flex-direction:column;height:100vh}
#header{background:var(--ink);color:#fff;padding:0 14px;height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0}

#toolbar2{background:var(--panel);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-shrink:0}
.tb-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--paper);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}

.tb-btn.active{background:var(--red);color:#fff;border-color:var(--red)}

.sort-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let SHRINES=[],map,markers=[],originMarker=null,clickMode=false;
let RESULT_BY_ID={};
let originLat=null,originLng=null,sortMode="date";

const now = new Date();
const todayY = now.getFullYear();
const todayM = now.getMonth()+1;
const todayD = now.getDate();

// 全角数字→半角、漢数字（十一月十三日 等）→算用数字に正規化
// （岡山などの全角表記、鹿児島の漢数字表記が日付解析に失敗し、開催順ソートで
// 末尾に沈んでしまう不具合の修正。表示用テキストは変更せず解析専用）
function normalizeDateStr(s){
  if(!s)return s;
  s=s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const kanjiDigit={'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const kanjiToNum=(kanji)=>{
    if(kanji==='十')return 10;
    const idx=kanji.indexOf('十');
    if(idx<0)return kanji.length===1&&kanji in kanjiDigit?kanjiDigit[kanji]:null;
    const tensDigit=idx>0?kanjiDigit[kanji[0]]:1;
    const onesStr=kanji.slice(idx+1);
    const ones=onesStr?kanjiDigit[onesStr]:0;
    if(tensDigit==null||(onesStr&&ones==null))return null;
    return tensDigit*10+(ones||0);
  };
  s=s.replace(/[一二三四五六七八九十]+(?=[月日])/g,m=>{
    const n=kanjiToNum(m);
    return n!==null?String(n):m;
  });
  return s;
}

// 第N曜日を実際の日付に変換
function resolveNthWeekday(year,month,nth,wd){
  const wdMap={日:0,月:1,火:2,水:3,木:4,金:5,土:6};
  const w=typeof wd==='string'?(wdMap[wd]??-1):wd;
  if(w<0)return null;
  if(nth==='last'){
    let d=new Date(year,month,0);
    while(d.getDay()!==w)d.setDate(d.getDate()-1);
    return d;
  }
  let d=new Date(year,month-1,1),count=0;
  while(true){
    if(d.getDay()===w){count++;if(count===nth)return d;}
    d.setDate(d.getDate()+1);
    if(d.getMonth()!==month-1)return null;
  }
}

// ===== 日付範囲解決エンジン（resolve_festival_date.py の移植） =====
// festivals[].date_str（自然言語表記）が指定した年に「いつ・何回」開催されるかを
// [{start:Date, end:Date}, ...] で返す。祭りは毎年同じ時期に繰り返される前提
// （年をまたぐ絶対日付は扱わない）。旧暦・干支基準日（初午等）は変換せず
// 月単位のフォールバックに留める。パースできない場合はfestival.monthがあれば
// それで月単位フォールバックし、それも無ければ空配列（判定不能）を返す
const HOLIDAY_FIXED={'元日':[1,1],'建国記念の日':[2,11],'昭和の日':[4,29],'山の日':[8,11],'文化の日':[11,3],'勤労感謝の日':[11,23]};
const HOLIDAY_NTH_MONDAY={'成人の日':[1,2],'海の日':[7,3],'敬老の日':[9,3],'体育の日':[10,2],'スポーツの日':[10,2]};
function equinoxDay(year,kind){
  const base=kind==='spring'?20.8431:23.2488;
  return Math.floor(base+0.242194*(year-1980)-Math.floor((year-1980)/4));
}
function monthRange(year,month){
  const last=new Date(year,month,0).getDate();
  return{start:new Date(year,month-1,1),end:new Date(year,month-1,last)};
}
function resolveNthWeekdayGroup(rest,year,month){
  if(!/^(第|最終|土|日|月|火|水|木|金)/.test(rest))return null;
  const prefix=rest.slice(0,20);
  const nths=[...prefix.matchAll(/第?(\d+|最終)/g)].map(m=>m[1]==='最終'?'last':parseInt(m[1]));
  const weekdays=[...prefix.matchAll(/(土|日|月|火|水|木|金)(?:曜日?)?/g)].map(m=>m[1]);
  if(!nths.length||!weekdays.length)return null;
  let pairs;
  if(nths.length===1)pairs=weekdays.map(wd=>[nths[0],wd]);
  else if(weekdays.length===1)pairs=nths.map(n=>[n,weekdays[0]]);
  else if(nths.length===weekdays.length)pairs=nths.map((n,i)=>[n,weekdays[i]]);
  else pairs=nths.flatMap(n=>weekdays.map(wd=>[n,wd]));
  const seen=new Set(),results=[];
  for(const[nth,wd]of pairs){
    const d=resolveNthWeekday(year,month,nth,wd);
    const key=d?d.getTime():null;
    if(d&&!seen.has(key)){seen.add(key);results.push({start:d,end:d});}
  }
  return results.length?results:null;
}
function resolveInMonth(rest,year,month){
  const g=resolveNthWeekdayGroup(rest,year,month);
  if(g)return g;
  let m=rest.match(/^(\d+)日?[〜～\-](\d+)日/);
  if(m){
    try{return[{start:new Date(year,month-1,parseInt(m[1])),end:new Date(year,month-1,parseInt(m[2]))}];}catch(e){return null;}
  }
  m=rest.match(/^(\d+)日/);
  if(m){const d=new Date(year,month-1,parseInt(m[1]));return[{start:d,end:d}];}
  m=rest.match(/^(上旬|中旬|下旬)/);
  if(m){
    const last=new Date(year,month,0).getDate();
    const ranges={'上旬':[1,10],'中旬':[11,20],'下旬':[21,last]};
    const[s,e]=ranges[m[1]];
    return[{start:new Date(year,month-1,s),end:new Date(year,month-1,Math.min(e,last))}];
  }
  return null;
}
function resolveHoliday(text,year){
  for(const name in HOLIDAY_FIXED){
    if(text.includes(name)){const[mo,da]=HOLIDAY_FIXED[name];const d=new Date(year,mo-1,da);return[{start:d,end:d}];}
  }
  for(const name in HOLIDAY_NTH_MONDAY){
    if(text.includes(name)){const[mo,nth]=HOLIDAY_NTH_MONDAY[name];const d=resolveNthWeekday(year,mo,nth,'月');if(d)return[{start:d,end:d}];}
  }
  if(text.includes('春分の日')){const d=new Date(year,2,equinoxDay(year,'spring'));return[{start:d,end:d}];}
  if(text.includes('秋分の日')){const d=new Date(year,8,equinoxDay(year,'autumn'));return[{start:d,end:d}];}
  return null;
}
function resolveFestivalOccurrences(dateStrRaw,monthHint,year){
  const dateStr=(dateStrRaw||'').trim();
  if(!dateStr)return monthHint?[monthRange(year,monthHint)]:[];
  const text=normalizeDateStr(dateStr);

  if(/旧暦|旧/.test(text)){
    let m=text.match(/(\d+)月/)||text.match(/(\d{1,2})\/(\d{1,2})/);
    if(m)return[monthRange(year,parseInt(m[1]))];
    return monthHint?[monthRange(year,monthHint)]:[];
  }

  if(text.startsWith('毎月')){
    const rest=text.slice(2);
    let occ=[];
    for(let m=1;m<=12;m++){const r=resolveInMonth(rest,year,m);if(r)occ=occ.concat(r);}
    if(occ.length)return occ;
    return monthHint?[monthRange(year,monthHint)]:[];
  }

  const holidayResult=resolveHoliday(text,year);
  if(holidayResult)return holidayResult;

  const mm=text.match(/(\d+)月/);
  if(mm){
    const month=parseInt(mm[1]);
    if(month>=1&&month<=12){
      const rest=text.slice(mm.index+mm[0].length);
      const result=resolveInMonth(rest,year,month);
      if(result)return result;
      return[monthRange(year,month)];
    }
  }

  const slashMatches=[...text.matchAll(/(\d{1,2})\/(\d{1,2})/g)];
  if(slashMatches.length){
    const results=[];
    for(const sm of slashMatches){
      const month=parseInt(sm[1]),day=parseInt(sm[2]);
      if(month>=1&&month<=12){
        try{const d=new Date(year,month-1,day);if(d.getMonth()===month-1)results.push({start:d,end:d});}catch(e){}
      }
    }
    if(results.length)return results;
  }

  return monthHint?[monthRange(year,monthHint)]:[];
}

// 祭典fが指定月(1-12)に開催されるか（月フィルタ用）。「取りこぼしより出しすぎ」
// 方針のため、今年・来年のどちらかで該当すればヒットとする
function festivalMatchesMonth(f,month){
  if(!month)return true;
  const check=year=>resolveFestivalOccurrences(f.date_str,f.month,year).some(o=>o.start.getMonth()+1===month||o.end.getMonth()+1===month);
  return check(todayY)||check(todayY+1);
}

// 開発用セルフテスト（test_resolve_festival_date.pyと同一の20+1ケース）。
// コンソールで動作確認するためのもので、UIには表示しない
window.resolveFestivalOccurrences=resolveFestivalOccurrences;
function _runDateEngineSelfTest(){
  const Y=2026;
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const eq=(a,b)=>a.length===b.length&&a.every((x,i)=>fmt(x.start)===b[i][0]&&fmt(x.end)===b[i][1]);
  const cases=[
    ['9月15日',null,[['2026-09-15','2026-09-15']]],
    ['３月１８日',null,[['2026-03-18','2026-03-18']]],
    ['10月第2日曜日',null,[['2026-10-11','2026-10-11']]],
    ['11月最終日曜',null,[['2026-11-29','2026-11-29']]],
    ['10月第4日曜日',null,[['2026-10-25','2026-10-25']]],
    ['8月第1土曜・日曜',null,[['2026-08-01','2026-08-01'],['2026-08-02','2026-08-02']]],
    ['７月１１～１４日',null,[['2026-07-11','2026-07-14']]],
    ['1月1-3日',null,[['2026-01-01','2026-01-03']]],
    ['10月14〜15日',null,[['2026-10-14','2026-10-15']]],
    ['旧6月1日',null,[['2026-06-01','2026-06-30']]],
    ['旧暦9月10日',null,[['2026-09-01','2026-09-30']]],
    ['7月下旬',null,[['2026-07-21','2026-07-31']]],
    ['4月上旬',null,[['2026-04-01','2026-04-10']]],
    ['２月中旬',null,[['2026-02-11','2026-02-20']]],
    ['10月体育の日',null,[['2026-10-12','2026-10-12']]],
    ['1月成人の日',null,[['2026-01-12','2026-01-12']]],
    ['7月海の日',null,[['2026-07-20','2026-07-20']]],
    ['2月初午',null,[['2026-02-01','2026-02-28']]],
    ['の土曜日',null,[]],
    ['よくわからない表記',5,[['2026-05-01','2026-05-31']]],
  ];
  let pass=0;
  cases.forEach(([ds,mh,expected],i)=>{
    const got=resolveFestivalOccurrences(ds,mh,Y);
    if(eq(got,expected))pass++;
    else console.warn(`[日付エンジン自己テスト] TC${i+1} FAIL: ${ds}`,'got=',got.map(o=>[fmt(o.start),fmt(o.end)]),'expected=',expected);
  });
  const got10=resolveFestivalOccurrences('毎月第1、第3日曜日',null,Y);
  if(got10.length===24)pass++;else console.warn('[日付エンジン自己テスト] 毎月 FAIL: count=',got10.length);
  console.log(`[日付エンジン自己テスト] ${pass}/${cases.length+1} 件成功`);
}
_runDateEngineSelfTest();

// 日付文字列→Dateオブジェクト（毎年繰り返し・来年も考慮）
function parseFestDate(dateStr){
  if(!dateStr)return null;
  dateStr=normalizeDateStr(dateStr);
  const today=new Date(todayY,todayM-1,todayD);
  // ○月○日
  const m1=dateStr.match(/(\d+)月\s*(\d+)日/);
  if(m1){
    const fm=parseInt(m1[1]),fd=parseInt(m1[2]);
    let d=new Date(todayY,fm-1,fd);
    if(d<today)d=new Date(todayY+1,fm-1,fd);
    return d;
  }
  // ○月第N曜日
  const m2=dateStr.match(/(\d+)月.*?第(\d+|最終)[^\d]*(日|月|火|水|木|金|土)/);
  if(m2){
    const fm=parseInt(m2[1]),nth=m2[2]==='最終'?'last':parseInt(m2[2]),wd=m2[3];
    let d=resolveNthWeekday(todayY,fm,nth,wd);
    if(d&&d<today)d=resolveNthWeekday(todayY+1,fm,nth,wd);
    return d;
  }
  // ○月上旬/中旬/下旬
  const m3=dateStr.match(/(\d+)月(上旬|中旬|下旬)/);
  if(m3){
    const fm=parseInt(m3[1]),fd=m3[2]==='上旬'?5:m3[2]==='中旬'?15:25;
    let d=new Date(todayY,fm-1,fd);
    if(d<today)d=new Date(todayY+1,fm-1,fd);
    return d;
  }
  // ○月のみ
  const m4=dateStr.match(/(\d+)月/);
  if(m4){
    const fm=parseInt(m4[1]);
    let d=new Date(todayY,fm-1,15);
    if(d<today)d=new Date(todayY+1,fm-1,15);
    return d;
  }
  return null;
}

// 祭典の「次回開催日」を推定。date_strから具体的な日付が解析できなければ
// monthフィールドを使い、その月の1日として扱う（月しか分からない祭典を
// 開催日不明として末尾に隔離せず、他の祭典と同じ基準で比較できるようにする）
function estimateFestDate(f){
  const d=parseFestDate(f.date_str||"");
  if(d)return d;
  if(f.month){
    const today=new Date(todayY,todayM-1,todayD);
    let d2=new Date(todayY,f.month-1,1);
    if(d2<today)d2=new Date(todayY+1,f.month-1,1);
    return d2;
  }
  return null;
}

// 毎年繰り返しなのでisPastは常にfalse
function isPast(fest){return false;}

// 表示用：第N曜日を解決した日付を括弧付きで返す
function resolvedDateStr(fest){
  const d=parseFestDate(fest.date_str);
  if(!d)return fest.date_str;
  if(/第|旬/.test(fest.date_str))return fest.date_str+'（'+(d.getMonth()+1)+'/'+(d.getDate())+'）';
  return fest.date_str;
}

let dataLoaded=false;
fetch("data.json?v=" + Date.now()).then(r=>r.json()).then(data=>{
  SHRINES=data;
  document.getElementById("total-sub").textContent=data.length.toLocaleString()+"社収録";
  document.getElementById("loading").classList.add("hide");
  // 都道府県セレクトを動的生成
  const prefs=[...new Set(data.map(s=>s.pref).filter(Boolean))].sort();
  const sel=document.getElementById("sel-pref");
  prefs.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;sel.appendChild(o);});
  dataLoaded=true;
  if(originLat!==null) search();
}).catch(e=>{
  document.getElementById("loading").innerHTML="<div style='color:#f99'>読み込み失敗: "+e+"</div>";
});

map=L.map("map").setView([36.5,137.5],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  attribution:"© <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>",maxZoom:19
}).addTo(map);

const mkIcon=(color,size)=>L.divIcon({html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid white;margin:${-size/2}px 0 0 ${-size/2}px;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>`,iconSize:[0,0],className:""});
const IC={red:mkIcon("#b51f1f",14),green:mkIcon("#1a7a3c",16),gray:mkIcon("#888",10),gold:mkIcon("#f59e0b",18)};

map.on("click",e=>{if(!clickMode)return;setOrigin(e.latlng.lat,e.latlng.lng,"クリックした地点");clickMode=false;document.getElementById("btn-click").classList.remove("active");});

function dist(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function setOrigin(lat,lng,label){
  originLat=lat;originLng=lng;
  if(originMarker)map.removeLayer(originMarker);
  originMarker=L.marker([lat,lng],{icon:IC.gold,zIndexOffset:1000}).addTo(map).bindPopup(label).openPopup();
  map.setView([lat,lng],13);
  if(dataLoaded) search();
}

function search(){
  if(originLat===null)return;
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const range=parseInt(document.getElementById("sel-range").value);
  const month=parseInt(document.getElementById("sel-month").value);
  const pref=document.getElementById("sel-pref").value;
  const excludePast=document.getElementById("chk-future").checked;

  let results=SHRINES.filter(s=>s.lat&&s.lng).map(s=>{
    const km=dist(originLat,originLng,s.lat,s.lng);
    // 過去除外フィルタ適用後の祭典リスト
    let fests=(s.festivals||[]).filter(f=>f.name||f.date_str).map(f=>{
      if(!f.month&&f.date_str){const mm=normalizeDateStr(f.date_str).match(/(\d+)月/);if(mm)return{...f,month:parseInt(mm[1])};}
      return f;
    });
    if(excludePast) fests=fests.filter(f=>!isPast(f));
    // 開催が近い順に並べ替え（カード/ポップアップ/モーダルの代表表示・先頭件が
    // 常に「今日から最も近い祭典」になるようにする。単なる掲載順にしない）。
    // 日付が具体的に解析できない（月のみ）祭典もその月の1日扱いで同じ土俵で
    // 比較し、末尾に隔離しない。月フィルタ指定時は、そのフィルタに合致する
    // 祭典を必ず先頭に出す（合致しない祭典が「代表」として表示・日数計算
    // されてしまうバグの修正）
    fests=fests.map(f=>{
      const d=estimateFestDate(f);
      const today=new Date(todayY,todayM-1,todayD);
      const days=d?Math.round((d-today)/86400000):null;
      const months=d?Math.max(0,(d.getFullYear()-todayY)*12+(d.getMonth()-(todayM-1))):999;
      const matchesFilter=month===0?true:festivalMatchesMonth(f,month);
      return{...f,_days:days,_months:months,_matchesFilter:matchesFilter};
    }).sort((a,b)=>{
      if(month!==0&&a._matchesFilter!==b._matchesFilter)return a._matchesFilter?-1:1;
      if(a._days!==null&&b._days!==null)return a._days-b._days;
      if(a._days!==null)return -1;
      if(b._days!==null)return 1;
      return 0;
    });
    const minDays=fests.length&&fests[0]._days!==null?fests[0]._days:null;
    const nm=fests.length?fests[0]._months:999;
    const isNow=nm===0;
    return{...s,km,fests,nm,minDays,isNow};
  }).filter(s=>{
    if(s.km>range)return false;
    if(pref!=="all"&&s.pref!==pref)return false;
    if(month===0)return true;
    // 月フィルタの判定はfests側で計算済みの_matchesFilter（日付解決エンジン
    // ベース）を使う。「その月に開催される祭典を1つ以上持つ神社」だけに絞る
    return s.fests.some(f=>f._matchesFilter);
  });

  if(sortMode==="distance"){
    results.sort((a,b)=>a.km-b.km);
  }else if(sortMode==="date"){
    results.sort((a,b)=>{
      // 祭典なし→後ろ
      const aHas=a.fests.length>0, bHas=b.fests.length>0;
      if(!aHas&&bHas)return 1;
      if(aHas&&!bHas)return-1;
      if(!aHas&&!bHas)return a.km-b.km;
      // 確定日付あり→日数で比較
      const aD=a.minDays,bD=b.minDays;
      if(aD!==null&&bD!==null)return aD-bD||a.km-b.km;
      if(aD!==null&&bD===null)return-1;
      if(aD===null&&bD!==null)return 1;
      // 両方曖昧→月で比較
      return a.nm-b.nm||a.km-b.km;
    });
    }else{
    // おすすめ順: 次の祭りまでの日数(距離補正あり)
    results.sort((a,b)=>{
      const aHas=a.fests.length>0, bHas=b.fests.length>0;
      if(!aHas&&bHas)return 1;
      if(aHas&&!bHas)return-1;
      if(!aHas&&!bHas)return a.km-b.km;
      const aScore=a.minDays!==null?a.minDays+a.km*0.5:(a.nm*30+a.km*0.5);
      const bScore=b.minDays!==null?b.minDays+b.km*0.5:(b.nm*30+b.km*0.5);
      return aScore-bScore;
    });
  }

  document.getElementById("status-bar").textContent=results.length+"件";

  RESULT_BY_ID={};
  results.slice(0,100).forEach(s=>{
    RESULT_BY_ID[s.id]=s;
    const icon=s.isNow?IC.green:s.fests.length?IC.red:IC.gray;
    const m=L.marker([s.lat,s.lng],{icon}).addTo(map);
    m._shrineId=s.id;
    const fh=s.fests.slice(0,3).map(f=>`<div style="color:#b51f1f;font-weight:600;font-size:12px;margin-top:4px">⛩ ${f.name||"祭典"}</div><div style="color:#888;font-size:11px">${resolvedDateStr(f)||""}</div>`).join("");
    const links=[s.official_url?`<a href="${s.official_url}" target="_blank" style="font-size:11px;color:#1a56a0">公式サイト →</a>`:"",s.source_url?`<a href="${s.source_url}" target="_blank" style="font-size:11px;color:#b51f1f">神社庁 →</a>`:""].filter(Boolean).join(" ｜ ");
    m.bindPopup(`<div style="font-family:sans-serif;min-width:190px;max-width:250px"><b style="font-size:14px">${s.name}</b><div style="font-size:11px;color:#888;margin:2px 0">${s.pref}</div><div style="color:#888;font-size:12px">距離: <b style="color:#333">${s.km.toFixed(1)}km</b></div><div style="color:#888;font-size:12px">${s.address||""}</div>${s.deity?`<div style="color:#888;font-size:12px">御祭神: ${s.deity}</div>`:""}`+
      (fh||'<div style="color:#888;font-size:12px;margin-top:4px">祭典情報なし</div>')+
      `<div style="margin-top:8px"><button class="popup-detail-btn" data-id="${s.id}">詳細を見る</button> ${links}</div></div>`);
    markers.push(m);
  });
  renderList(results);
}

function mkBadge(s){
  if(!s.fests.length)return"";
  if(s.minDays===0)return`<span class="badge b-today">今日！</span>`;
  if(s.minDays===1)return`<span class="badge b-soon">明日</span>`;
  if(s.minDays!==null&&s.minDays<=7)return`<span class="badge b-soon">${s.minDays}日後</span>`;
  if(s.minDays!==null&&s.minDays<=30)return`<span class="badge b-soon">${s.minDays}日後</span>`;
  if(s.isNow)return`<span class="badge b-now">今月</span>`;
  if(s.nm<999)return`<span class="badge b-month">${s.nm}ヶ月後</span>`;
  return"";
}

function renderList(results){
  const list=document.getElementById("list"),empty=document.getElementById("empty");
  document.getElementById("hint").style.display="none";
  list.querySelectorAll(".card").forEach(c=>c.remove());
  const label={recommend:"⭐ おすすめ順",distance:"📍 距離順",date:"📅 開催順"}[sortMode];
  document.getElementById("ph-title").textContent=`検索結果 (${label})`;
  document.getElementById("ph-sub").textContent=`${results.length}件 / ${document.getElementById("sel-range").value}km以内`;
  if(!results.length){empty.style.display="block";return;}
  empty.style.display="none";
  results.slice(0,100).forEach((s,i)=>{
    const card=document.createElement("div");
    card.className="card"+(s.isNow?" this-month":"");
    card.dataset.id=s.id;
    const fh=s.fests.slice(0,2).map(f=>`<div class="card-fest">${f.name||"祭典"}</div><div class="card-date">${resolvedDateStr(f)||""}</div>`).join("");
    card.innerHTML=`<div class="card-rank">${i+1}位</div><div class="card-name">${s.name}</div><span class="card-pref">${s.pref}</span><span class="badge b-dist">${s.km.toFixed(1)}km</span>${mkBadge(s)}${fh||'<div class="card-date" style="margin-top:4px;color:#bbb">祭典情報なし</div>'}<div class="card-addr">${s.address||""}</div>`;
    card.addEventListener("click",()=>{map.setView([s.lat,s.lng],15);highlightCard(s.id);openModal(s);});
    list.appendChild(card);
  });
}

function openModal(s){
  if(!s)return;
  document.getElementById("modal-name").textContent=s.name||"";
  const fests=s.fests||s.festivals||[];
  const festHtml=fests.length
    ?fests.map(f=>`<div class="modal-fest"><div class="fname">⛩ ${f.name||"祭典"}</div><div class="fdate">${resolvedDateStr(f)||""}</div></div>`).join("")
    :`<div style="color:var(--muted);font-size:12px;margin-top:4px">祭典情報なし</div>`;
  const links=[s.official_url?`<a href="${s.official_url}" target="_blank" rel="noopener">公式サイト →</a>`:"",s.source_url?`<a href="${s.source_url}" target="_blank" rel="noopener">神社庁 →</a>`:""].filter(Boolean).join("");
  document.getElementById("modal-body").innerHTML=`
    <span class="card-pref">${s.pref||""}</span>${typeof s.km==="number"?`<span class="badge b-dist" style="margin-left:4px">${s.km.toFixed(1)}km</span>`:""}
    <div class="modal-row"><div class="modal-label">鎮座地</div>${s.address||"—"}</div>
    ${s.deity?`<div class="modal-row"><div class="modal-label">御祭神</div>${s.deity}</div>`:""}
    <div class="modal-row"><div class="modal-label">例祭・祭事</div>${festHtml}</div>
    ${links?`<div class="modal-links">${links}</div>`:""}
  `;
  document.getElementById("modal-overlay").classList.add("show");
}
function closeModal(){document.getElementById("modal-overlay").classList.remove("show");}
document.getElementById("modal-close").addEventListener("click",closeModal);
document.getElementById("modal-overlay").addEventListener("click",e=>{if(e.target.id==="modal-overlay")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
document.addEventListener("click",e=>{
  if(e.target.classList.contains("popup-detail-btn")){
    openModal(RESULT_BY_ID[e.target.dataset.id]);
  }
});

function highlightCard(id){
  document.querySelectorAll(".card.active").forEach(c=>c.classList.remove("active"));
  const c=document.querySelector(`.card[data-id="${id}"]`);
  if(c){c.classList.add("active");c.scrollIntoView({behavior:"smooth",block:"nearest"});}
}

document.getElementById("btn-gps").addEventListener("click",function(){
  if(!navigator.geolocation){alert("位置情報が使えません");return;}
  this.textContent="📍 取得中…";const btn=this;
  navigator.geolocation.getCurrentPosition(
    pos=>{setOrigin(pos.coords.latitude,pos.coords.longitude,"現在地");btn.textContent="📍 現在地から探す";},
    ()=>{alert("位置情報の取得に失敗しました");btn.textContent="📍 現在地から探す";}
  );
});
document.getElementById("btn-click").addEventListener("click",function(){clickMode=!clickMode;this.classList.toggle("active",clickMode);});

// 初期表示で自動的に現在地取得を試みる。拒否/失敗時はアラートを出さず、
// 従来通り「地図をクリックして探す」待ちの状態のままにする
if(navigator.geolocation){
  const gpsBtn=document.getElementById("btn-gps");
  gpsBtn.textContent="📍 取得中…";
  navigator.geolocation.getCurrentPosition(
    pos=>{setOrigin(pos.coords.latitude,pos.coords.longitude,"現在地");gpsBtn.textContent="📍 現在地から探す";},
    ()=>{gpsBtn.textContent="📍 現在地から探す";}
  );
}
document.querySelectorAll(".sort-btn").forEach(btn=>{
  btn.addEventListener("click",function(){
    document.querySelectorAll(".sort-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");sortMode=this.dataset.sort;search();
  });
});
document.getElementById("sel-range").addEventListener("change",search);
document.getElementById("sel-month").addEventListener("change",search);
document.getElementById("sel-pref").addEventListener("change",search);
document.getElementById("chk-future").addEventListener("change",search);
</script>
